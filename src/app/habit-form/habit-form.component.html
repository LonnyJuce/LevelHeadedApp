<div class="habit-form-header">
  <div>
    <p class="eyebrow">Quest Builder</p>
    <h2>Create New Habit</h2>
  </div>
</div>

<form class="habit-form" (ngSubmit)="submit()">
  <label>
    <span>Title</span>
    <input
      type="text"
      [(ngModel)]="form.title"
      name="habitTitle"
      required
      minlength="1"
    />
  </label>

  <label>
    <span>Description</span>
    <textarea
      rows="3"
      [(ngModel)]="form.description"
      name="habitDescription"
    ></textarea>
  </label>

  <div class="habit-form-grid">
    <label>
      <span>Type</span>
      <select [(ngModel)]="form.type" name="habitType">
        <option [ngValue]="HabitType.POSITIVE">Positive</option>
        <option [ngValue]="HabitType.NEGATIVE">Negative</option>
      </select>
    </label>

    <label>
      <span>Attribute</span>
      <select
        [(ngModel)]="form.attribute"
        name="habitAttribute"
        required
        [ngModelOptions]="{ updateOn: 'blur' }"
      >
        @for (attribute of stats; track attribute) {
          <option [ngValue]="attribute">{{ attribute }}</option>
        }
      </select>
    </label>

    <label>
      <span>Reset period</span>
      <select [(ngModel)]="form.resetPeriod" name="resetPeriod">
        <option [ngValue]="HabitResetPeriod.DAILY">Daily</option>
        <option [ngValue]="HabitResetPeriod.WEEKLY">Weekly</option>
      </select>
    </label>

    <label>
      <span>Difficulty</span>
      <select [(ngModel)]="form.difficulty" name="habitDifficulty">
        <option [ngValue]="HabitDifficulty.EASY">Easy</option>
        <option [ngValue]="HabitDifficulty.MEDIUM">Medium</option>
        <option [ngValue]="HabitDifficulty.HARD">Hard</option>
      </select>
    </label>

    <label>
      <span>Target / {{ form.resetPeriod }}</span>
      <input
        type="number"
        [(ngModel)]="form.targetPerWeek"
        name="targetPerWeek"
        min="1"
        step="1"
        required
      />
    </label>
  </div>

  <div class="habit-form-actions">
    <button mat-stroked-button type="button" (click)="cancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
      Cancel
    </button>
    <button mat-flat-button type="submit" [disabled]="!isFormValid">
      <mat-icon aria-hidden="true">save</mat-icon>
      Create habit
    </button>
  </div>
</form>
